<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Olalá Viajes</title>
  {% load static %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/olala.css' %}">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f8; }
    .login-card { max-width: 400px; width: 100%; }
    .login-logo { max-height: 72px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="login-card card shadow-sm p-4">
    <div class="text-center">
      <img src="{% static 'img/logo.png' %}" alt="Olalá Viajes" class="login-logo">
      <h1 class="h4 mb-1">Panel de gestión</h1>
      <p class="text-muted small mb-4">Ingresá con tu usuario de administración</p>
    </div>
    {% if form.errors %}
    <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-teal w-100">Ingresar</button>
    </form>
    <p class="text-center text-muted small mt-3 mb-0">
      Panel: <strong>olala-viajes.onrender.com</strong><br>
      <a href="{{ public_web_url }}/" target="_blank" rel="noopener">Ver catálogo público (web.app)</a>
    </p>
  </div>
</body>
</html>
